[GameSettings]
; === Debug Settings ===
bMaxsuPoise_EnableDebugLog = false
; Enable debug logging for zero damage troubleshooting (true/false or 1/0)
; Logs all multiplier values when selected target receives zero poise damage
; Keep OFF during normal gameplay to avoid log spam

; === Ragdoll Replacer ===
bMaxsuPoise_PlayerRagdollReplacer = true
; Convert player ragdoll (from giants, etc.) into large stagger animation
; true = play stagger animation instead of ragdoll | false = normal ragdoll physics
; Prevents frustrating ragdoll deaths while keeping challenge

bMaxsuPoise_NPCRagdollReplacer = true
; Convert NPC ragdoll into large stagger animation
; true = play stagger animation instead of ragdoll | false = normal ragdoll physics
; Makes combat more consistent and predictable

; === Stagger Protection & Animation Lock Prevention ===
fMaxsuPoise_StaggerProtectTime = 1.500000
; Duration (seconds) of full stagger immunity after poise break (large stagger)
; Prevents animation lock from fast consecutive hits during stagger animation
; 1.0s = immune for 1 second | Higher = more forgiving | Lower = more punishing

fMaxsuPoise_SmallStaggerProtectMult = 0.750000
; Multiplier for protection time after small/medium staggers
; Prevents fast weapons from stunlocking with repeated small staggers
; 0.8 = 0.8s immunity (increased to prevent 2H stunlock) | 0.6 = 0.6s | 0.0 = no protection

; === Poise Regeneration ===
fMaxsuPoise_PoiseRegen = 0.150000
; Poise regeneration per second
; Faster regen prevents follower/summon groups from permanently stunlocking enemies

fMaxsuPoise_RegenDelayTime = 2.000000
; Delay (seconds) before poise starts regenerating after taking damage
; 2.0s = 2 second delay | Higher = you stay vulnerable longer | Lower = faster recovery

; === Stagger Thresholds ===
; These define what % of max poise health triggers each stagger level
fMaxsuPoise_SmallStaggerTHLD = 0.30000
; Small stagger at fMaxsuPoise_SmallStaggerTHLD % poise damage (minor interruption, frequent)
; Example: 200 max poise, 50 damage = small stagger
; Should happen regularly but not be game-breaking

fMaxsuPoise_MediumStaggerTHLD = 0.500000
; Medium stagger at fMaxsuPoise_MediumStaggerTHLD % poise damage (noticeable disruption)
; Example: 200 max poise, 100 damage = medium stagger
; Requires commitment - heavy weapon or multiple hits

fMaxsuPoise_LargeStaggerTHLD = 0.850000
; Large stagger at fMaxsuPoise_LargeStaggerTHLD % poise damage (serious vulnerability, rare!)
; Example: 200 max poise, 160 damage = large stagger
; Should be difficult to achieve - rewards heavy weapons, crits, charging attacks
; Makes poise break (100%+) the primary goal, large stagger is secondary

; === Base Poise Damage ===
fMaxsuPoise_BaseMeleePoiseDamage = 12.000000
; Base poise damage for melee attacks (before weapon type multiplier)
; 12 = balanced for Requiem | Higher = everyone staggers more easily | Lower = tankier combat

fMaxsuPoise_BaseRangePoiseDamage = 8.000000
; Base poise damage for ranged attacks (arrows, bolts)
; 8 = 66% of melee | Ranged typically less stagger than melee

uMaxsuPoise_BlockedMode = 1
; 0 = Percent blocked mode (50% block = 50% poise damage)
; 1 = Fully blocked mode (any block = 0 poise damage, no block = 100%)
; Requiem uses 1 for binary blocking (you either block or you don't)

fMaxsuPoise_BaseMagicPoiseDamage = 120.000000
; Base poise damage for spells (very high to make magic threatening)
; 120 = 10x melee base | Magic should be devastating to poise

; === Base Poise Health (Survivability) ===
fMaxsuPoise_BasePoiseHealth = 70.000000
; Base poise health before any bonuses (naked character)
; 50 = starting point | Higher = everyone tankier | Lower = more fragile

fMaxsuPoise_HeavyArmorPoiseBonus = 0.650000
; Multiplier bonus for wearing heavy armor
; 0.65 = significant heavy armor advantage | 1.0 = double poise | 0.3 = slight advantage

fMaxsuPoise_BaseArmorPoiseHealth = 80.000000
; Flat poise bonus from armor pieces
; 60 = solid contribution | Higher = armor matters more | Lower = armor matters less

; === Requiem-Specific Enhancements ===
fMaxsuPoise_ArmorRatingScale = 0.400000
; Converts armor rating (AR) to poise health (balanced for Requiem's high AR values)
; Formula: PoiseFromAR = ArmorRating × 0.4
; Example: 500 AR = 200 poise bonus | Higher = AR dominates | Lower = AR less important
; Requiem has 600-800 AR endgame, so 0.4 keeps poise in reasonable range

fMaxsuPoise_MinStaminaMult = 0.400000
; Minimum poise multiplier when stamina reaches 0% (harsh penalty!)
; 0.4 = 40% poise at 0 stamina | 1.0 = no penalty | 0.0 = instant stagger at 0 stamina
; Formula: PoiseMult = lerp(MinStaminaMult, 1.0, currentStamina/maxStamina)
; Stamina management is CRITICAL - exhausted = vulnerable

fMaxsuPoise_WeaponWeightScale = 0.055000
; How much weapon weight adds to poise damage
; Formula: Bonus = WeaponWeight × 0.055
; Example: 20 weight greatsword = +1.1 poise damage multiplier
; Higher = heavy weapons dominate more | Lower = weight less important

fMaxsuPoise_WeaponDamageScale = 0.012000
; How much weapon damage adds to poise damage (material quality matters!)
; Formula: Bonus = WeaponDamage × 0.012
; Example: 50 damage weapon = +0.6 poise damage multiplier
; Higher = high damage weapons break poise faster | Lower = damage less important

fMaxsuPoise_CriticalHitMult = 2.500000
; Poise damage multiplier for critical hits (devastating!)
; 2.5 = 250% poise damage on crit | 1.0 = no bonus | 3.0 = nearly guaranteed stagger
; Crits should be punishing - rewarding precise play

fMaxsuPoise_VelocityMult = 1.400000
; Poise damage multiplier when sprinting or moving forward (charging bonus)
; 1.4 = 140% damage when charging | 1.0 = no bonus | 2.0 = double damage
; Rewards aggressive momentum-based play

fMaxsuPoise_DefaultCreatureMult = 1.500000
; Default poise damage multiplier for creatures without specific race entries
; 1.5 = 150% of base damage | Higher = creatures more threatening | Lower = less threatening
; Used when creature race not found in MaxsuPoise_Creature.ini


